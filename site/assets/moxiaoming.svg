<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="墨小溟">
  <!-- 墨小溟 IP（云朵水母）· 忠实还原产品 js/ip.js 的 idle 姿态
       配色取自产品 styles.css 的 ip 系列变量默认值；几何与路径与 ip.js 完全一致。
       独立文件供 img 引用（避免每页内联重复），内置极轻的浮动动效（克制，服务"平静"调性）。
       注意：XML 注释内不得出现连续两个短横，否则整个 SVG 会被判为非法 XML。 -->
  <defs>
    <radialGradient id="body" cx="46%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#F3EEFF" stop-opacity=".92"/>
      <stop offset="56%"  stop-color="#D9CDF5" stop-opacity=".64"/>
      <stop offset="100%" stop-color="#B8A9E8" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C9BCF0" stop-opacity=".72"/>
      <stop offset="55%"  stop-color="#C9BCF0" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#C9BCF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFE7C4" stop-opacity=".80"/>
      <stop offset="52%"  stop-color="#CFE4F7" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#CFE4F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6C6689"/>
      <stop offset="100%" stop-color="#4E4969"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C0B0EC" stop-opacity=".52"/>
      <stop offset="70%"  stop-color="#C0B0EC" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C0B0EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .ip-float{ animation: ip-float 6s ease-in-out infinite; transform-origin:100px 110px; }
    @keyframes ip-float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-4px) } }
    .ip-ant{ animation: ip-ant 4s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center; }
    .ip-ant--r{ animation-delay:-2s; }
    @keyframes ip-ant{ 0%,100%{ transform:rotate(-2.5deg) } 50%{ transform:rotate(2.5deg) } }
    @media (prefers-reduced-motion:reduce){ .ip-float,.ip-ant{ animation:none } }
  </style>
  <g class="ip-float">
    <!-- 外光晕 -->
    <circle cx="100" cy="102" r="90" fill="url(#halo)"/>

    <!-- 头顶触角（两根小天线，末端发光） -->
    <g>
      <g class="ip-ant ip-ant--l">
        <path d="M82 52 C69 34 71 21 80 13" fill="none" stroke="#C0B0EC" stroke-width="3" stroke-linecap="round"/>
        <circle cx="80" cy="12" r="10" fill="#FFD9A8" opacity=".20"/>
        <circle cx="80" cy="12" r="4.4" fill="#FFD9A8"/>
      </g>
      <g class="ip-ant ip-ant--r">
        <path d="M118 52 C131 34 129 21 120 13" fill="none" stroke="#C0B0EC" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="12" r="10" fill="#FFD9A8" opacity=".20"/>
        <circle cx="120" cy="12" r="4.4" fill="#FFD9A8"/>
      </g>
    </g>

    <g>
      <!-- 体内核心光 -->
      <ellipse cx="100" cy="106" rx="52" ry="48" fill="url(#core)"/>

      <!-- 八条垂须（水母感）：短、柔、向下淡出 -->
      <path d="M56 128 C50 140 51 150 57 154" fill="none" stroke="url(#wisp)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M68 134 C63 145 64 154 70 158" fill="none" stroke="url(#wisp)" stroke-width="2.9" stroke-linecap="round"/>
      <path d="M80 138 C75 148 76 156 81 160" fill="none" stroke="url(#wisp)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M95 141 C95 152 97 160 100 164" fill="none" stroke="url(#wisp)" stroke-width="2.9" stroke-linecap="round"/>
      <path d="M105 141 C106 152 105 160 101 164" fill="none" stroke="url(#wisp)" stroke-width="2.9" stroke-linecap="round"/>
      <path d="M120 138 C125 148 124 156 119 160" fill="none" stroke="url(#wisp)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M132 134 C137 145 136 154 130 158" fill="none" stroke="url(#wisp)" stroke-width="2.9" stroke-linecap="round"/>
      <path d="M144 128 C150 140 149 150 143 154" fill="none" stroke="url(#wisp)" stroke-width="2.8" stroke-linecap="round"/>

      <!-- 云朵水母身体：圆顶 + 波浪裙摆 -->
      <path d="M100 26 C142 26 166 56 164 92 C163 104 158 114 150 121 C152 130 147 138 138 137 C134 145 126 147 120 142 C113 149 105 149 100 145 C95 149 87 149 80 142 C74 147 66 145 62 137 C53 138 48 130 50 121 C42 114 37 104 36 92 C34 56 58 26 100 26 Z"
            fill="url(#body)"/>

      <!-- 左上柔光（体积感） -->
      <ellipse cx="72" cy="60" rx="23" ry="14" fill="#ffffff" opacity=".34" transform="rotate(-24 72 60)"/>

      <!-- 体内流动微光（screen 混合） -->
      <g style="mix-blend-mode:screen">
        <circle cx="76"  cy="116" r="7.4" fill="#FFE7C4" opacity=".72"/>
        <circle cx="110" cy="128" r="5.6" fill="#CFE4F7" opacity=".66"/>
        <circle cx="127" cy="109" r="6.2" fill="#FFE7C4" opacity=".58"/>
        <circle cx="92"  cy="134" r="3.8" fill="#CFE4F7" opacity=".55"/>
      </g>

      <!-- 温柔大眼（无嘴巴） -->
      <g transform="rotate(-5 82 101)">
        <ellipse cx="82" cy="101" rx="10.8" ry="12.8" fill="url(#eye)"/>
        <ellipse cx="82" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/>
        <circle cx="78.1" cy="95.9" r="3.6" fill="#ffffff" opacity=".95"/>
        <circle cx="85.6" cy="106.6" r="1.7" fill="#ffffff" opacity=".48"/>
      </g>
      <g transform="rotate(5 118 101)">
        <ellipse cx="118" cy="101" rx="10.8" ry="12.8" fill="url(#eye)"/>
        <ellipse cx="118" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/>
        <circle cx="114.1" cy="95.9" r="3.6" fill="#ffffff" opacity=".95"/>
        <circle cx="121.6" cy="106.6" r="1.7" fill="#ffffff" opacity=".48"/>
      </g>
    </g>
  </g>
</svg>
