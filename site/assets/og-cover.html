<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>og-cover</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  .cover{
    width:1200px;height:630px;position:relative;
    background:
      radial-gradient(60% 60% at 82% 28%, rgba(195,180,238,.40), transparent 70%),
      radial-gradient(50% 50% at 10% 86%, rgba(255,184,140,.26), transparent 70%),
      linear-gradient(135deg,#FFF8F0 0%,#F3EDFF 100%);
    display:flex;align-items:center;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:0 90px;
  }
  .left{flex:1;}
  .eyebrow{display:inline-block;font-size:22px;font-weight:700;letter-spacing:2px;color:#7A66C4;
    background:#F3EDFF;padding:8px 20px;border-radius:999px;margin-bottom:30px;}
  .title{font-size:96px;font-weight:800;color:#3A3A3A;letter-spacing:2px;line-height:1.12;}
  .title .accent{background:linear-gradient(135deg,#C3B4EE 0%,#9E8CD8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
  .tagline{font-size:36px;color:#6B6478;margin-top:24px;font-weight:500;}
  .meta{margin-top:44px;font-size:24px;color:#9A93A6;letter-spacing:1px;}
  .right{display:flex;align-items:center;justify-content:center;padding-left:40px;}
  .right svg{width:300px;height:300px;filter:drop-shadow(0 18px 40px rgba(94,78,140,.22));}
</style>
</head>
<body>
  <div class="cover">
    <div class="left">
      <span class="eyebrow">情绪倾诉陪伴</span>
      <div class="title">墨小溟<br/><span class="accent">说出来，就轻一点</span></div>
      <div class="tagline">一只会追问、会记住、不评判的紫色小墨鱼</div>
      <div class="meta">语音情绪复盘教练　·　免费　·　本地优先　·　不诊断</div>
    </div>
    <div class="right">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="b" cx="46%" cy="30%" r="80%"><stop offset="0%" stop-color="#F3EEFF" stop-opacity=".92"/><stop offset="56%" stop-color="#D9CDF5" stop-opacity=".64"/><stop offset="100%" stop-color="#B8A9E8" stop-opacity=".42"/></radialGradient>
          <radialGradient id="h" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#C9BCF0" stop-opacity=".72"/><stop offset="100%" stop-color="#C9BCF0" stop-opacity="0"/></radialGradient>
          <radialGradient id="c" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFE7C4" stop-opacity=".8"/><stop offset="100%" stop-color="#CFE4F7" stop-opacity="0"/></radialGradient>
          <linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6C6689"/><stop offset="100%" stop-color="#4E4969"/></linearGradient>
          <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C0B0EC" stop-opacity=".52"/><stop offset="100%" stop-color="#C0B0EC" stop-opacity="0"/></linearGradient>
        </defs>
        <circle cx="100" cy="102" r="90" fill="url(#h)"/>
        <path d="M82 52 C69 34 71 21 80 13" fill="none" stroke="#C0B0EC" stroke-width="3" stroke-linecap="round"/>
        <circle cx="80" cy="12" r="4.4" fill="#FFD9A8"/>
        <path d="M118 52 C131 34 129 21 120 13" fill="none" stroke="#C0B0EC" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="12" r="4.4" fill="#FFD9A8"/>
        <ellipse cx="100" cy="106" rx="52" ry="48" fill="url(#c)"/>
        <path d="M56 128 C50 140 51 150 57 154" fill="none" stroke="url(#w)" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M68 134 C63 145 64 154 70 158" fill="none" stroke="url(#w)" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M80 138 C75 148 76 156 81 160" fill="none" stroke="url(#w)" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M95 141 C95 152 97 160 100 164" fill="none" stroke="url(#w)" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M105 141 C106 152 105 160 101 164" fill="none" stroke="url(#w)" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M120 138 C125 148 124 156 119 160" fill="none" stroke="url(#w)" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M132 134 C137 145 136 154 130 158" fill="none" stroke="url(#w)" stroke-width="2.9" stroke-linecap="round"/>
        <path d="M144 128 C150 140 149 150 143 154" fill="none" stroke="url(#w)" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M100 26 C142 26 166 56 164 92 C163 104 158 114 150 121 C152 130 147 138 138 137 C134 145 126 147 120 142 C113 149 105 149 100 145 C95 149 87 149 80 142 C74 147 66 145 62 137 C53 138 48 130 50 121 C42 114 37 104 36 92 C34 56 58 26 100 26 Z" fill="url(#b)"/>
        <ellipse cx="72" cy="60" rx="23" ry="14" fill="#ffffff" opacity=".34" transform="rotate(-24 72 60)"/>
        <g style="mix-blend-mode:screen">
          <circle cx="76" cy="116" r="7.4" fill="#FFE7C4" opacity=".72"/>
          <circle cx="110" cy="128" r="5.6" fill="#CFE4F7" opacity=".66"/>
          <circle cx="127" cy="109" r="6.2" fill="#FFE7C4" opacity=".58"/>
          <circle cx="92" cy="134" r="3.8" fill="#CFE4F7" opacity=".55"/>
        </g>
        <g transform="rotate(-5 82 101)"><ellipse cx="82" cy="101" rx="10.8" ry="12.8" fill="url(#e)"/><ellipse cx="82" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/><circle cx="78.1" cy="95.9" r="3.6" fill="#fff" opacity=".95"/><circle cx="85.6" cy="106.6" r="1.7" fill="#fff" opacity=".48"/></g>
        <g transform="rotate(5 118 101)"><ellipse cx="118" cy="101" rx="10.8" ry="12.8" fill="url(#e)"/><ellipse cx="118" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/><circle cx="114.1" cy="95.9" r="3.6" fill="#fff" opacity=".95"/><circle cx="121.6" cy="106.6" r="1.7" fill="#fff" opacity=".48"/></g>
      </svg>
    </div>
  </div>
</body>
</html>
