<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 墨小溟 App 图标（v1.1）：云朵水母 IP。颜色在此硬编码（独立 SVG 无法读 CSS 变量），
       与 js/ip.js 的待机态变量组保持一致：身体 #B8A9E8 / 微光 #FFB88C+#A8C8E8 / 背景 #FFF8F0 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#E9E0FC"/>
    </linearGradient>
    <radialGradient id="body" cx="46%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F3EEFF" stop-opacity=".96"/>
      <stop offset="56%" stop-color="#D9CDF5" stop-opacity=".84"/>
      <stop offset="100%" stop-color="#B8A9E8" stop-opacity=".72"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE7C4" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#CFE4F7" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#CFE4F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9BCF0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#C9BCF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6C6689"/>
      <stop offset="100%" stop-color="#4E4969"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0B0EC" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#C0B0EC" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#C0B0EC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <g transform="translate(512,540) scale(2.62) translate(-100,-100)">
    <circle cx="100" cy="104" r="90" fill="url(#halo)"/>

    <!-- 头顶触角 -->
    <g>
      <path d="M82 52 C69 34 71 21 80 13" fill="none" stroke="#C0B0EC" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M118 52 C131 34 129 21 120 13" fill="none" stroke="#C0B0EC" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="80" cy="12" r="10" fill="#FFD9A8" opacity=".22"/>
      <circle cx="120" cy="12" r="10" fill="#FFD9A8" opacity=".22"/>
      <circle cx="80" cy="12" r="4.6" fill="#FFC78F"/>
      <circle cx="120" cy="12" r="4.6" fill="#FFC78F"/>
    </g>

    <!-- 体内核心光 -->
    <ellipse cx="100" cy="106" rx="52" ry="48" fill="url(#core)"/>

    <!-- 垂须 -->
    <path d="M80 138 C75 148 76 156 81 160" fill="none" stroke="url(#wisp)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M100 142 C100 152 101 159 104 163" fill="none" stroke="url(#wisp)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M120 138 C125 148 124 156 119 160" fill="none" stroke="url(#wisp)" stroke-width="3.4" stroke-linecap="round"/>

    <!-- 云朵水母身体 -->
    <path d="M100 26 C142 26 166 56 164 92
             C163 104 158 114 150 121 C152 130 147 138 138 137
             C134 145 126 147 120 142 C113 149 105 149 100 145
             C95 149 87 149 80 142 C74 147 66 145 62 137
             C53 138 48 130 50 121 C42 114 37 104 36 92
             C34 56 58 26 100 26 Z" fill="url(#body)"/>

    <!-- 左上柔光 -->
    <ellipse cx="72" cy="60" rx="23" ry="14" fill="#ffffff" opacity=".36" transform="rotate(-24 72 60)"/>

    <!-- 内部流动微光 -->
    <g style="mix-blend-mode:screen">
      <circle cx="76" cy="116" r="7.6" fill="#FFE7C4" opacity=".75"/>
      <circle cx="110" cy="128" r="5.8" fill="#CFE4F7" opacity=".68"/>
      <circle cx="127" cy="109" r="6.4" fill="#FFE7C4" opacity=".60"/>
      <circle cx="92" cy="134" r="4" fill="#CFE4F7" opacity=".56"/>
    </g>

    <!-- 眼睛（无嘴巴） -->
    <g transform="rotate(-5 82 101)">
      <ellipse cx="82" cy="101" rx="10.8" ry="12.8" fill="url(#eye)"/>
      <ellipse cx="82" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/>
      <circle cx="78.1" cy="95.9" r="3.7" fill="#ffffff"/>
      <circle cx="85.6" cy="106.6" r="1.8" fill="#ffffff" opacity=".5"/>
    </g>
    <g transform="rotate(5 118 101)">
      <ellipse cx="118" cy="101" rx="10.8" ry="12.8" fill="url(#eye)"/>
      <ellipse cx="118" cy="90.6" rx="10.8" ry="6.4" fill="#F3EEFF" opacity=".38"/>
      <circle cx="114.1" cy="95.9" r="3.7" fill="#ffffff"/>
      <circle cx="121.6" cy="106.6" r="1.8" fill="#ffffff" opacity=".5"/>
    </g>
  </g>
</svg>
