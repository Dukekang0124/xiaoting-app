<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 墨小溟 App 图标（v1.6.7）
       IP 关键约束：墨鱼 **没有** 顶部两根长触角（那是水母特征，v1.1 曾搞错，已移除）。
       造型：圆润躯体（宽>高，带两侧裙边鳍）+ 8 条短腕从下方中央聚拢后自然散开，末端淡紫柔光。
       比例：躯体 + 触手整体占画布 ~72-75%，安全边距 10%。
       背景：低饱和深紫径向渐变（中心亮 → 四周压暗），深海光晕。
       质感：半通透磨砂紫 + 微弱内发光 + 水墨弥散（呼应"墨"）。 -->

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#6E5794"/>
      <stop offset="55%" stop-color="#5C4880"/>
      <stop offset="100%" stop-color="#3A2E54"/>
    </radialGradient>

    <radialGradient id="body" cx="42%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#EFE8FF" stop-opacity=".95"/>
      <stop offset="52%" stop-color="#CBB9F0" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#A78DD6" stop-opacity=".68"/>
    </radialGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE7C4" stop-opacity=".70"/>
      <stop offset="60%" stop-color="#CFE4F7" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#CFE4F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ink">
      <stop offset="0%" stop-color="#8E76C0" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#8E76C0" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#8E76C0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tip">
      <stop offset="0%" stop-color="#D9C8FF" stop-opacity=".68"/>
      <stop offset="100%" stop-color="#D9C8FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="fin">
      <stop offset="0%" stop-color="#BBA6E8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#BBA6E8" stop-opacity=".12"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- 水墨弥散（底层，大范围低透明度） -->
  <ellipse cx="512" cy="520" rx="380" ry="340" fill="url(#ink)"/>

  <!-- 两侧裙边鳍（墨鱼特征：体侧的波浪薄膜） -->
  <path d="M212 420 C260 360 330 320 420 300 C360 350 320 420 300 500 C270 490 235 460 212 420 Z"
        fill="url(#fin)"/>
  <path d="M812 420 C764 360 694 320 604 300 C664 350 704 420 724 500 C754 490 789 460 812 420 Z"
        fill="url(#fin)"/>

  <!-- 8 条短腕：从躯体下方中央聚拢 → 向下自然散开 → 末端微光 -->
  <g fill="none" stroke="#B7A1E6" stroke-linecap="round" stroke-opacity=".88">
    <path d="M452 660 C424 724 418 786 434 838" stroke-width="22"/>
    <path d="M484 668 C470 734 474 794 496 844" stroke-width="21"/>
    <path d="M514 670 C516 736 528 796 552 846" stroke-width="20"/>
    <path d="M546 666 C560 730 580 788 608 836" stroke-width="20"/>
    <path d="M576 656 C598 716 626 766 660 806" stroke-width="19"/>
    <path d="M602 640 C634 694 668 736 706 766" stroke-width="18"/>
    <path d="M424 646 C390 706 362 754 334 792" stroke-width="18"/>
    <path d="M398 624 C358 678 326 720 298 752" stroke-width="17"/>
  </g>

  <!-- 触手末端淡紫柔光 -->
  <g>
    <circle cx="434" cy="838" r="17" fill="url(#tip)"/>
    <circle cx="496" cy="844" r="16" fill="url(#tip)"/>
    <circle cx="552" cy="846" r="16" fill="url(#tip)"/>
    <circle cx="608" cy="836" r="15" fill="url(#tip)"/>
    <circle cx="660" cy="806" r="14" fill="url(#tip)"/>
    <circle cx="706" cy="766" r="13" fill="url(#tip)"/>
    <circle cx="334" cy="792" r="13" fill="url(#tip)"/>
    <circle cx="298" cy="752" r="12" fill="url(#tip)"/>
  </g>

  <!-- 圆润躯体（宽 > 高，中心 512,420；上圆下略收，像斗篷） -->
  <path d="M512 120
           C672 120 786 236 788 392
           C790 500 748 580 668 626
           L356 626
           C276 580 234 500 236 392
           C238 236 352 120 512 120 Z"
        fill="url(#body)"/>

  <!-- 微弱内发光（躯体内上缘，柔和渐隐） -->
  <ellipse cx="452" cy="268" rx="180" ry="120" fill="url(#core)"/>

  <!-- 眼睛：低饱和、克制、不幼态（无大高光） -->
  <g>
    <ellipse cx="438" cy="452" rx="34" ry="42" fill="#5C5675" opacity=".90"/>
    <ellipse cx="586" cy="452" rx="34" ry="42" fill="#5C5675" opacity=".90"/>
    <circle cx="428" cy="434" r="10" fill="#F3EEFF" opacity=".22"/>
    <circle cx="576" cy="434" r="10" fill="#F3EEFF" opacity=".22"/>
  </g>
</svg>
